<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Traductor Morse</title>
      </head>
      <body>
        <main class="card">
            <h1>Traductor de Código Morse</h1>
                <button id="modo" class="modo" type="button">Texto → Morse</button>

                    <label id="etiquetaEntrada" for="entrada">Escribe tu texto:</label>
                        <textarea id="entrada" rows="4" placeholder="Hola mundo"></textarea>

                            <p id="error" class="error"></p>

                                <button id="traducir" type="button">Traducir</button>

                                    <label for="salida">Resultado:</label>
                                        <textarea id="salida" rows="4" readonly></textarea>

                                            <div class="fila">
                                                  <button id="copiar" type="button">Copiar</button>
                                                        <button id="limpiar" type="button">Limpiar</button>
                                                            </div>
                                                              </main>
                                                              </body>
                                                              </html>en
