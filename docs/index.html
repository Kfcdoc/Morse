<!doctype html><html lang=es><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Traductor Morse</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0f172a;color:#e2e8f0;font-family:Arial,sans-serif;padding:16px}.card{width:100%;max-width:520px;background:#1e293b;padding:24px;border-radius:16px;display:flex;flex-direction:column;gap:10px}h1{margin:0 0 8px;font-size:1.4rem;text-align:center}textarea{width:100%;padding:10px;border-radius:8px;border:1px solid#475569;background:#0f172a;color:#e2e8f0;font-size:1rem;resize:vertical}button{padding:12px;border:none;border-radius:8px;background:#38bdf8;color:#0f172a;font-weight:700;font-size:1rem;cursor:pointer}button:hover{background:#7dd3fc}.modo{background:#a78bfa}.fila{display:flex;gap:10px}.fila button{flex:1;background:#94a3b8}.error{color:#f87171;min-height:1.2em;margin:0;font-size:.9rem}</style><script defer src=bundle.js></script></head><body><main class=card><h1>Traductor de Código Morse</h1><button id=modo class=modo type=button>Texto → Morse</button> <label id=etiquetaEntrada for=entrada>Escribe tu texto:</label> <textarea id=entrada rows=4 placeholder="Hola mundo"></textarea><p id=error class=error></p><button id=traducir type=button>Traducir</button> <label for=salida>Resultado:</label> <textarea id=salida rows=4 readonly></textarea><div class=fila><button id=copiar type=button>Copiar</button> <button id=limpiar type=button>Limpiar</button></div></main>en</body></html>
